AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CI/CD Sample with Next.js - CloudFormation Template'

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 'EC2 Key Pair for SSH access'

  InstanceType:
    Type: String
    Default: 't3.micro'
    Description: 'EC2 Instance Type'
    AllowedValues:
      - 't3.micro'
      - 't3.small'
      - 't3.medium'

Resources:
  # IAM Role for EC2
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # Security Group
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for Next.js application'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0bba69335379e17f8  # Ubuntu 22.04 LTS (ap-northeast-1)
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          echo "=== Starting EC2 Setup ===" >> /var/log/user-data.log

          # Update system
          apt-get update
          apt-get install -y curl git docker.io docker-compose

          # Start Docker
          systemctl start docker
          systemctl enable docker

          # Create app directory
          mkdir -p /app
          cd /app

          # Install Node.js 20
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

          echo "=== EC2 Setup Complete ===" >> /var/log/user-data.log
      Tags:
        - Key: Name
          Value: aws-cicd-sample-instance

Outputs:
  EC2InstancePublicIP:
    Description: 'Public IP of the EC2 instance'
    Value: !GetAtt EC2Instance.PublicIp

  EC2InstanceDNS:
    Description: 'Public DNS of the EC2 instance'
    Value: !GetAtt EC2Instance.PublicDnsName

  IAMRoleArn:
    Description: 'ARN of the IAM Role'
    Value: !GetAtt EC2Role.Arn
